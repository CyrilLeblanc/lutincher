# Lutincher front: SPA + load balancer over the two api instances.
# REST routes are forwarded as-is (the api owns the /api/* prefix); the
# healthcheck lives at the api root (/healthz), exposed as /api/healthz.

# Round-robin over the instances. An instance that fails is skipped for 10 s
# (passive health check); a request that hits a dead instance is retried on
# the other one (proxy_next_upstream, nginx default: error and timeout).
upstream lutincher_api {
    server api1:3000 max_fails=1 fail_timeout=10s;
    server api2:3000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path falls back to the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST snapshots (GET /api/... is forwarded verbatim).
    location /api/ {
        proxy_pass http://lutincher_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck alias (the api routes /healthz at its root).
    location = /api/healthz {
        proxy_pass http://lutincher_api/healthz;
    }

    # WebSocket upgrade (auction hub). Each socket sticks to the instance it
    # opened on; after a failure the client reconnects and lands on the other.
    location /ws {
        proxy_pass http://lutincher_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Built assets are content-hashed: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
