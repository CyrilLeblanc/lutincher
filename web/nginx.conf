# Lutincher front: SPA + reverse proxy to the api service.
# REST routes are forwarded as-is (the api owns the /api/* prefix); the
# healthcheck lives at the api root (/healthz), exposed as /api/healthz.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path falls back to the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST snapshots (GET /api/... is forwarded verbatim).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck alias (the api routes /healthz at its root).
    location = /api/healthz {
        proxy_pass http://api:3000/healthz;
    }

    # WebSocket upgrade (auction hub).
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Built assets are content-hashed: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
